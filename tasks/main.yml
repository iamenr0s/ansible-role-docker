---
# tasks file for ansible-role-docker
- name: Include distribution-specific installation tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] | lower }}.yml"
  tags:
    - docker
    - install

- name: Enable and start docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags:
    - docker
    - service

- name: Ensure docker users are added to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags:
    - docker
    - users

- name: Create custom daemon.json
  ansible.builtin.template:
    src: daemon_json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
    owner: root
    group: root
  notify:
    - Daemon reload
    - Restart docker
  tags:
    - docker
    - config
