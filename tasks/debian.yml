---
# Debian/Ubuntu installation tasks
- name: Ensure apt prerequisite packages are installed
  ansible.builtin.apt:
    name: "{{ docker_apt_prerequisite_packages }}"
    state: present
    update_cache: true
    force_apt_get: true
  tags:
    - docker
    - packages

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_path | dirname }}"
    state: directory
    mode: '0755'
  tags:
    - docker
    - repository

- name: Download the Docker apt GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_key }}"
    dest: "{{ docker_apt_keyring_path }}"
    mode: '0644'
  tags:
    - docker
    - repository

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ docker_apt_repository }}"
    state: present
    update_cache: true
  tags:
    - docker
    - repository

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  tags:
    - docker
    - packages
